name: CI/CD for Hybrid Cloud Storage Optimizer

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      
      - name: Install dependencies
        run: cd hybrid_cloud_storage_optimizer && uv sync

      - name: Run the crew (smoke test)
        run: cd hybrid_cloud_storage_optimizer && uv run crewai run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Lint with ruff
        run: cd hybrid_cloud_storage_optimizer && uv run ruff check .

      - name: Format check with black
        run: cd hybrid_cloud_storage_optimizer && uv run black --check .